# DRAFT (not frozen) - model-vs-market evaluation engine on market-benchmark-v2.
# Separately versioned. It does NOT modify market-benchmark-v2 (SHA below). Freezing needs owner
# approval BEFORE any outcome-based comparison; until then nothing here may be scored.
engine_id: model-vs-market-v2-engine
engine_version: v1
status: DRAFT
market_protocol:
  path: configs/preregistration/market_benchmark_v2.yaml
  sha256: ad319ba7384cd95d5b1c2c45fd5c3c058af6af41c6e95c3926f253e990fae70c
  used_unchanged: [population, timing, identity, market, metrics]
model:
  model_version: phase5-gbm-v1
  source: walk-forward inner-fold test predictions (run d10ff67cd3b7, test folds 2020, 2021, 2022)
  column: p_gbm_recal
  secondary_models:
    - {run: 0a5b056019ec, column: p_elo_overall_recal}
contrasts:   # (model - market); negative favours the model
  - [p_model, p_market_reference]
  - [p_model, p_market_consensus]
consensus: median of distinct sources (identical rounded price pair counts once); at least 2 distinct sources
bootstrap: {block: iso_week_of_tournament_start, replicates: 2000, seed: 20261104, level: 0.95}
layers:
  probability_quality: paired log-loss and Brier (the decision-relevant result)
  theoretical_market_benchmark: de-vigged reference book and consensus; NOT executable prices
  executable_prices: unavailable from historical snapshots; margins, best quoted prices and a cost grid reported only
cost_grid: [0.0, 0.01, 0.02, 0.03]
limitations:
  - 2020-2022 are inner development years already inspected for phase5-gbm-v1 and Phase 2. A V2
    result is NOT an independent confirmation and NOT evidence of profitability.
  - Slam main draws only (10 editions); a narrow, highly liquid segment.
  - Wimbledon 2022 and US Open 2022 are design-exposed (reported with and without).
