# PRE-REGISTERED PROTOCOL — FROZEN 2026-11-03 by explicit owner approval, before any V2 acquisition
# and before any outcome was accessed for this protocol. Any change requires a new protocol_id and a
# new entry in docs/DECISIONS.md; never edit in place. market-benchmark-v1 stays frozen and unchanged.
# Copied from docs/preregistration/market-benchmark-v2-CANDIDATE.yaml
# (SHA-256 0f3cca23c117b29d4d712b697dd68c9003221f40d745dff17d34f7061a9befdf).
# Only status, frozen_on, calendar_sha256, the contingency authorisation and the implementation
# record differ from the candidate.
protocol_id: market-benchmark-v2
status: FROZEN
frozen_on: 2026-11-03
purpose: >-
  Probability-quality comparison of the frozen Phase 2 models against de-vigged bookmaker
  probabilities observed at the start of each match day (10:00 tournament-local), on identical
  ATP Grand Slam main-draw matches. Not a trading or profitability test.

estimand: start_of_match_day_market   # differs from v1 (about 60 min before each match)

population:
  provider: the_odds_api
  editions: [ao-2021, ao-2022, rg-2020, rg-2021, rg-2022, wim-2021, wim-2022, uso-2020, uso-2021, uso-2022]
  calendar_file: src/quantedge/reference/v2_draft_edition_calendar.csv
  calendar_sha256: 2db8ee7b0b041e2eba54d3926a8566d5350eed9e9e6ae537c1af5c0f0227d4a1
  calendar_verification:
    first_and_last_days: organizer_required   # all 10 editions organizer-stated
    rest_days: reporting_only_waiver           # every calendar day is requested; labels only
    expected_empty_days: reporting_only_waiver # every calendar day is requested; labels only
    complete_calendar_verified: false          # no edition has every field officially sourced
  canonical_draw_category: tour_main
  require_gate0_eval_eligible: true     # applied at confirmatory time only
  design_exposed_editions: [wim-2022, uso-2022]   # reported with and without

timing:
  decision_local_time: "10:00"
  time_zones:
    tennis_atp_aus_open_singles: Australia/Melbourne
    tennis_atp_french_open: Europe/Paris
    tennis_atp_wimbledon: Europe/London
    tennis_atp_us_open: America/New_York
  snapshot_window_minutes: 10            # admissible iff T_d - 10 min < snapshot <= T_d
  min_listed_lead_minutes: 60            # as listed in the decision snapshot; else short_lead
  first_qualification_only: true
  validity_censoring: started_by_any_later_snapshot_excludes
  later_revisions_move_decision: false

identity:
  link_statuses_claimable: [linked, duplicate_provider_event]
  claimants: all_listed_in_decision_snapshot
  concurrent_claimants_at_first_decision: exclude_permanently
  merge_or_choose: never

market:
  region: eu
  market: match_winner
  exchange_lay_prices: excluded
  freshness_primary_minutes: 30
  freshness_sensitivity_minutes: [15, 60]
  missing_source_time: reject
  distinct_source_rule: identical_price_pair_same_observation_counts_once
  primary_reference_bookmaker: pinnacle
  primary_adequacy_min_availability: 0.80
  fallback_rule: highest_availability_outcome_blind_clones_collapsed
  consensus_min_distinct_sources: 2
  devig_primary: proportional
  devig_secondary: [power, shin]

acquisition:
  one_request_per_calendar_day: true    # rest and expected-empty days included
  planned_requests: 143
  credits_per_request: 10
  base_credits: 1430
  programme_ceiling_credits: 1430       # recommended ceiling for the whole programme
  contingency_credits: 0                # owner: the 143-credit contingency is NOT authorized
  feasibility_included_in_base: true    # the 70 feasibility credits are part of the 1,430
  max_credits_per_manifest: 130
  max_retries: 0
  quota_reconciliation: per_call
  rescue_or_retime: never
  lock: write_once_per_stage_before_confirmatory_run
  feasibility:
    edition: uso-2021
    days: [2021-08-30, 2021-08-31, 2021-09-01, 2021-09-02, 2021-09-03, 2021-09-04, 2021-09-05]
    tranches:
      - {requests: 2, max_credits: 20}
      - {requests: 5, max_credits: 50, requires_passing_gate_of: 1, separate_approval: true}

metrics:                               # unchanged from v1; computed only in the confirmatory run
  primary: [paired_log_loss_difference, paired_brier_difference]
  bootstrap_block: iso_week_of_tournament_start
  bootstrap_replicates: 2000
  confidence_level: 0.95

conduct:
  max_confirmatory_runs: 1
  timing_rule_revised_after_outcomes: never
  start_of_play_uncertainty: reported_coverage_risk_not_a_relaxation
  late_check_and_holdout: untouched

implementation:                        # code state frozen with this protocol
  commit: c938e2c4eba5a56d0b34e741b4497d6a19f8d7c7
  files_sha256:
    src/quantedge/odds/v2_draft.py: ba505b20cf7eac8442be0190eb85f02ead19b2b434ad642f2716814ee2eb02a7
    src/quantedge/odds/stage.py: 7c7b692b9f2952a9270c87b3ee319dcb30582144c2e406af98730228dc89c512
  feasibility_manifest_sha256: df880fd4449dd204c8381441772af2d0c713c33a380d084716a8446d48eaceb2
  feasibility_tranche_plan_sha256: 605a7eea66dc19768203a51515c31470c90805cb5303d7fed122070063311411
