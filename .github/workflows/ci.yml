name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install (locked)
        run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check src tests
      - name: Ruff format
        run: uv run ruff format --check src tests
      - name: Mypy (strict)
        run: uv run mypy
      - name: Repository hygiene (no data, secrets or large files tracked)
        run: uv run python -m quantedge.devtools.hygiene
      - name: Tests (synthetic fixtures only; real-data tests skip without data/)
        run: uv run pytest -m "not local"
